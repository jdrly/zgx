[package]
name = "zgx-compare-rune"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
exclude = ["rune-src"]
[dependencies]
# anomalyco/rune at the dev rev build.sh checks out into rune-src/, with PATCH.md's
# Tx::wheel applied (MIT; see README.md).
rune = { path = "rune-src/crates/rune" }
zgx-workload = { path = "../workload" }
# The micro benchmark settles the GPU between batches (the version Rune uses).
wgpu = { version = "30", default-features = false }

# Rune's own benchmark profile (its bench scripts refuse other builds), as
# its workspace defines it.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

# What the comparison builds: Rune's perf profile at its strongest, as the
# other frameworks' `dist` (fat LTO, one codegen unit). Rune's bench scripts
# insist on perf by path, to keep incremental release builds out; this is
# not incremental either.
[profile.dist]
inherits = "perf"
lto = "fat"
codegen-units = 1

[profile.release]
codegen-units = 16
